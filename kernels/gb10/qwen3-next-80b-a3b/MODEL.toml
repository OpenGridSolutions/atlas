[model]
name = "qwen3-next-80b-a3b"
hf_id = "nvidia/Qwen3-Next-80B-A3B-Instruct-NVFP4"
params = "80B"
active_params = "3B"
layers_attention = 12
layers_ssm = 36
moe_experts = 512
moe_topk = 10
hidden_dim = 2048
head_dim = 256
q_heads = 16
kv_heads = 2

# Qwen3-Next — older architecture, no official thinking mode. Instruct-only model.
# 2026-06-06: aligned rep_pen 1.1->1.0 + dry 0.5->0.0 with the qwen3.6-35b 10/10 campaign
# finding ("temp=0 A/B: 1.1=mangled finish=length; 1.0=clean finish=stop"). Qwen vendor also
# deprecates repetition_penalty>1.0. Keep Qwen instruct top_p=0.8.
[sampling.thinking_text]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.thinking_coding]
temperature = 0.6
top_p = 0.95
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[[model_types]]
model_type = "qwen3_next"

# Model-specific behavior overrides. Without this section the server
# falls back to the hardcoded defaults in atlas-kernels/build.rs
# (max_thinking_budget=256), which is too low for users running
# extended reasoning prompts on Qwen3-Next-80B.
[behavior]
# Content-loop watchdog ENABLED 2026-06-06: robust-coherence probe showed Qwen3-Next-80B
# answers correctly then RUNS ON into fabricated "Human:/assistant" turns (fails to emit
# <|im_end|>). The watchdog rolls back run-on/loop attractors to a clean boundary.
enable_loop_watchdog = true
# Qwen3-Next-80B does not have an official thinking-mode template,
# but supports `enable_thinking=true` via the chat-template kwargs.
# When tools are active, leave thinking on — the model uses it
# constructively for multi-step tool reasoning.
thinking_in_tools = true
# Generous ceiling for extended reasoning prompts. Per-request
# `thinking.budget_tokens` still wins below this; CLI
# `--max-thinking-budget` overrides this entirely.
max_thinking_budget = 4096
# 2026-06-06: thinking_default FALSE — Qwen3-Next-80B is the Instruct (non-thinking) variant with
# no official thinking-mode template (see header). Forcing thinking_default=true made the reasoning
# parser mis-capture output as 885-token "reasoning" and never stop. thinking_in_tools stays true.
thinking_default = false
# Benchmarked 2026-04-11: K=2 (1 draft) is the sweet spot for the
# 80B-A3B MoE — verify overhead at K=3 wipes out acceptance gains.
default_num_drafts = 1

[kernel]
moe_gate_shmem_bytes = 4096   # hidden_dim(2048) * sizeof(bf16)

# Admission cost constants (docs/design/deadline-admission.md), measured
# 2026-10-11 on GB10 with tests/estimate_calibration.py against serve.sh
# (--max-batch-size 4). This target serves both Qwen3-Next checkpoints;
# the block keeps the slower value of the two per constant:
#   Qwen3-Next-80B-A3B-Thinking-NVFP4: prefill 898 tok/s, decode [13.3, 24.6, 49.7, 49.6]
#   Qwen3-Coder-Next-NVFP4:            prefill 892 tok/s, decode [13.5, 25.0, 49.8, 50.3]
# decode_step_ms is per stream at batch 1/2/4/8; batch 8 queues behind
# --max-batch-size 4, so it equals the batch-4 step. The Thinking
# template forces <think> with budget 4096, which does not count against
# max_tokens — the estimate covers max_tokens only.
[estimate]
prefill_tok_s = 892
decode_step_ms = [13.5, 25.0, 49.8, 50.3]

# Sessions kept warm in the KV pool. The server splits the pool into this
# many equal context windows when the model loads, capped at the native
# window (262144 tokens); it is the only model in memory while it serves.
# Rule: ceil(pool tokens / native window), raised where it does not divide
# evenly so every session gets the same share. Computed, not measured, for
# GB10 with a 100 GiB serving block (2026-11-10): ~244k tokens per session
# (Thinking), ~260k (Coder-Next). The load logs the real pool, the rule's
# count for it and the window ("Context window: ..."); set the count from
# that line.
[serving]
sessions = 11
# Transposed copies of the MoE expert weights for prefill: 40.5 GiB on top
# of the 47.3 GiB of weights, which would leave the KV pool about 15 GiB.
# Off: prefill uses the grouped GEMM on the original layout — the path
# every GB10 load of this model has taken so far (the copies never fit in
# the free memory the loader saw), and the one [estimate] was measured on.
# Without this key the loader decides by the free memory at load time.
moe_prefill_transpose = false
